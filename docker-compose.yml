version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: greenhouse-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: greenhouse
    ports:
      - "5433:5432"
    volumes:
      - greenhouse-db-data:/var/lib/postgresql/data

volumes:
  greenhouse-db-data:
